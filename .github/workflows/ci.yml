name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify release notes encoding
        shell: pwsh
        run: ./tools/verify_release_notes.ps1
      - name: Configure
        run: cmake --preset windows-release
      - name: Build
        run: cmake --build --preset windows-release --parallel
      - name: Test
        run: ctest --preset windows-release --output-on-failure
      - name: Verify source contracts
        shell: pwsh
        run: ./plugins/juce/tests/SourceContractTests.ps1
      - name: Read release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION is not semantic: $version"
          }
          "TONETRACE_VERSION=$version" >> $env:GITHUB_ENV
          "TONETRACE_PACKAGE=ToneTrace_EQ_${version}_Windows_x64" >> $env:GITHUB_ENV
      - name: Stage Windows release package
        id: package
        shell: pwsh
        run: |
          $source = (Get-Location).Path
          $stage = Join-Path $source "dist/$env:TONETRACE_PACKAGE"
          $manifest = Join-Path $stage "docs/BUILD_MANIFEST.txt"
          cmake --install build-cmake/windows-x64-release `
            --config Release --component Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake "-DROOT=$stage" "-DSOURCE_ROOT=$source" `
            "-DOUT=$manifest" "-DPLATFORM_NAME=Windows x64" `
            "-DPROJECT_VERSION=$env:TONETRACE_VERSION" `
            -P cmake/write_build_manifest.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake "-DSTAGE_DIR=$stage" `
            "-DPROJECT_VERSION=$env:TONETRACE_VERSION" `
            -P cmake/verify_package.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location dist
          cmake -E tar cf "$env:TONETRACE_PACKAGE.zip" --format=zip `
            $env:TONETRACE_PACKAGE
          $archiveResult = $LASTEXITCODE
          Pop-Location
          if ($archiveResult -ne 0) { exit $archiveResult }
          cmake -E tar tf "dist/$env:TONETRACE_PACKAGE.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -LiteralPath `
            "dist/$env:TONETRACE_PACKAGE.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:TONETRACE_PACKAGE.zip" | Set-Content `
            "dist/$env:TONETRACE_PACKAGE.zip.sha256" -Encoding ascii
          "ZIP SHA-256: $hash"
          "### Windows package`n`nSHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY
      - name: Validate packaged VST3
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 12
        shell: pwsh
        run: ./tools/validate_windows_package.ps1 -Validator pluginval -StageDirectory "dist/$env:TONETRACE_PACKAGE"
      - name: Validate packaged CLAP
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 12
        shell: pwsh
        run: ./tools/validate_windows_package.ps1 -Validator clap-validator -StageDirectory "dist/$env:TONETRACE_PACKAGE"
      - name: Upload validator reports
        if: ${{ always() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-validator-reports
          path: dist/validator-reports/
          if-no-files-found: warn
      - name: Upload Windows release package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.TONETRACE_PACKAGE }}
          path: |
            dist/${{ env.TONETRACE_PACKAGE }}.zip
            dist/${{ env.TONETRACE_PACKAGE }}.zip.sha256
          if-no-files-found: error

  linux:
    name: Linux verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify source contracts
        shell: pwsh
        run: ./plugins/juce/tests/SourceContractTests.ps1
      - name: Configure
        run: cmake --preset linux-release
      - name: Build
        run: cmake --build --preset linux-release --parallel
      - name: Test
        run: ctest --preset linux-release --output-on-failure

  macos:
    name: macOS Universal
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, test, and package universal macOS plug-ins
        run: bash BUILD_MACOS.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ToneTrace-macOS-Universal
          path: build-macos/release/*
          if-no-files-found: error
          retention-days: 7
      - name: Verify universal binaries
        run: |
          root="$PWD"
          for bundle in "Tone Trace EQ.component" "Tone Trace EQ.vst3" "Tone Trace EQ.clap"; do
            lipo "$root/build-macos/portable/ToneTrace/$bundle/Contents/MacOS/Tone Trace EQ" -verify_arch arm64 x86_64
          done
      - name: Install the packaged release and validate the Audio Unit
        run: |
          mount="$RUNNER_TEMP/ToneTrace-release"
          mkdir -p "$mount"
          hdiutil attach build-macos/release/ToneTrace_EQ_*_macOS_Universal.dmg -mountpoint "$mount" -nobrowse
          sudo installer -pkg "$mount/Install Tone Trace EQ.pkg" -target /
          hdiutil detach "$mount"
          component="/Library/Audio/Plug-Ins/Components/Tone Trace EQ.component"
          codesign --verify --strict --deep --verbose=2 "$component"
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents' "$component/Contents/Info.plist"
          sudo killall -9 AudioComponentRegistrar || true
          for attempt in {1..12}; do
            auval -a > "$RUNNER_TEMP/au-components.txt"
            if grep -E 'aufx[[:space:]]+TTRE[[:space:]]+Lane' "$RUNNER_TEMP/au-components.txt"; then
              break
            fi
            sleep 5
          done
          cat "$RUNNER_TEMP/au-components.txt"
          set -o pipefail
          auval -v aufx TTRE Lane 2>&1 | tee AU_VALIDATION_LOG.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: macOS-validation-logs
          path: |
            BUILD_MACOS_LOG.txt
            AU_VALIDATION_LOG.txt
            build-macos/Testing/Temporary/LastTest.log
          retention-days: 7
