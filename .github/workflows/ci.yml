name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure
        run: cmake --preset windows-release
      - name: Build
        run: cmake --build --preset windows-release --parallel
      - name: Test
        run: ctest --preset windows-release
      - name: Upload Windows test plug-in
        uses: actions/upload-artifact@v4
        with:
          name: ToneTrace-unmerged-windows-x64
          path: build-cmake/windows-x64-release/plugins/clap/Release/Tone Trace EQ.clap
          if-no-files-found: error

  linux:
    name: Linux verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure
        run: cmake --preset linux-release
      - name: Build
        run: cmake --build --preset linux-release --parallel
      - name: Test
        run: ctest --preset linux-release
