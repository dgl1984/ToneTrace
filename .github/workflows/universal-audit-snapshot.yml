name: Universal audit snapshot

on:
  push:
    branches:
      - fix/universal-workflow-status

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source snapshot
        run: |
          rm -rf .git
          zip -qr ToneTrace-universal-audit-source.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ToneTrace-universal-audit-source
          path: ToneTrace-universal-audit-source.zip
          if-no-files-found: error
