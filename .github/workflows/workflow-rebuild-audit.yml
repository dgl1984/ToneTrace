name: Workflow state rebuild audit
on:
  push:
    branches: [tmp/workflow-state-rebuild]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Rebuild clean main tree
        shell: bash
        run: |
          cp .tmp_workflow/rebuild_workflow.py /tmp/rebuild_workflow.py
          cp .tmp_workflow/normalize_editor_setter.py /tmp/normalize_editor_setter.py
          cp .tmp_workflow/thread_handoff.py /tmp/thread_handoff.py
          cp .tmp_workflow/editor_stage_cleanup.py /tmp/editor_stage_cleanup.py
          cp .tmp_workflow/update_workflow_tests.py /tmp/update_workflow_tests.py
          cp .tmp_workflow/fix_test_escaping.py /tmp/fix_test_escaping.py
          git fetch origin main
          git checkout -B workflow-audit origin/main
          python /tmp/rebuild_workflow.py
          python /tmp/normalize_editor_setter.py
          python /tmp/thread_handoff.py
          python /tmp/editor_stage_cleanup.py
          python /tmp/update_workflow_tests.py
          python /tmp/fix_test_escaping.py
          git diff --check
          ! grep -R "pendingWorkflowCommand_\|lastWorkflowStep_\|setWorkflowStep\|consumePendingWorkflowCommand\|consumeWorkflowCommandWhenIdle" -n plugins/clap/tonetrace_clap.cpp plugins/clap/tonetrace_win32_editor.cpp
          ! grep -R "ParameterId::WorkflowAction" -n plugins/clap/tonetrace_clap.cpp plugins/clap/tonetrace_win32_editor.cpp tests/test_clap.cpp
      - name: Configure
        run: cmake -S . -B build-audit -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-audit --parallel 2
      - name: Test
        run: ctest --test-dir build-audit --output-on-failure
